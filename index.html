<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крис и Виталя | Свадебное приглашение</title>
    <!-- Подключение шрифта DotGothic16 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wedding_invitation">
        <!-- Блок 1: Шапка (фон + текст) -->
        <div class="head_block">
            <!-- Фон шапки -->
            <img class="head_image" src="images/Web/Head_background_pixeled.png" alt="Приглашение">
            <!-- Текст шапки -->
            <div class="head_text">
                <div class="head_title">Крис <span class="heart_1">♥</span> Виталя</div>
                <div class="head_subtitle">Суббота | 3 октября | <span class="year_2026">2026</span></div>
            </div>
        </div>
        <!-- Блок 2: ЗАГС (текст + изображение) -->
        <div class="CRO_block">
            <div class="CRO_text">
                <h2 class="CRO_title">Церемония</h2>
                <p class="CRO_time">Время: 12:00</p>
                <p class="CRO_place">Место: <a href="https://yandex.com/maps/org/otdel_zags_administratsii_velikogo_novgoroda/82764194170/?ll=31.274986%2C58.529257&utm_source=main_stripe_big&z=17" target="_blank" rel="noopener noreferrer">ЗАГС</a></p>
                <p class="CRO_address">Адрес: Тихвинская ул., д. 11/16</p>
            </div>
            <div class="CRO_image">
                <img src="images/Web/CRO_pixel.png" alt="Здание ЗАГСа">
            </div>
        </div>
    </div>
        <!-- Блок 3:  -->
        
    </div>
</body>
</html>
